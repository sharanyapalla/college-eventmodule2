<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Events | Utsav 2026 College Event Portal</title><meta name="description" content="Browse, search and filter all festival events.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css">
</head><body><div id="site-header"></div>
<section class="page-hero"><div class="container"><h1 style="font-size:clamp(2rem,5vw,3rem)">Events</h1><p>Search, filter and sort all events, then register for the ones you like.</p></div></section>
<main class="section"><div class="container"><div class="toolbar"><input id="search" type="search" placeholder="Search events, venues or coordinators" aria-label="Search events"><select id="sort" aria-label="Sort events"><option value="date">Sort by date</option><option value="name">Sort by name</option><option value="cat">Sort by category</option></select><span id="count" aria-live="polite" style="color:var(--muted)"></span></div>
<div class="chips" id="chips"></div><div class="grid g3" id="eventGrid"></div></div></main>
<div class="modal" id="detailModal" role="dialog" aria-modal="true"><div class="modal-box"></div></div>
<div id="site-footer"></div><script src="js/data.js"></script><script src="js/main.js"></script>
<script src="js/events.js"></script>
</body></html>
